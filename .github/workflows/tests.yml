name: CAP-03 tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run CAP-03 unit tests
        working-directory: capture/cap03
        run: python -m unittest discover -s tests -v
